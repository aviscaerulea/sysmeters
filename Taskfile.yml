# vim: set ft=yaml fenc=utf-8 ff=unix sw=2 ts=2 et :
$schema: https://taskfile.dev/schema.json
version: "3"

vars:
  APP_NAME: sysmeters
  ARCH: x64

# build と release が共有する VERSION の定義（YAML アンカーで、x- 接頭辞の拡張キーは Task が無視する）。
# git describe の失敗（.git なし、git 未導入等）で VERSION が空文字のまま続行するのを防ぐ。
# パイプの終了コードは sed のものになり、トップレベルの set: [pipefail] は動的変数に効かない
# ため、コマンド内で pipefail を指定する。代替値で埋めずにタスクを止める。
# トップレベル vars に置くと Task がタスク起動のたびに評価し、VERSION を使わない test や clean
# まで git の失敗で止まるため、参照する build と release のタスク単位 vars からアンカーで参照する。
# Task はタスク単位の vars を CLI の VERSION=x より優先し、指定を黙って無視する。
# そのためテンプレートで CLI 指定を優先し、未指定時だけ git describe で求める
# （gh-release の規約 task release VERSION=$VERSION を通すため）。git 不在の環境でも
# VERSION=x を明示すればビルドできる。
# Task のテンプレートは CLI 指定と環境変数を区別しないため、環境変数 VERSION も同じく優先する
# （VERSION 以外の変数名で受けると gh-release の規約から外れるため、この優先は仕様とする）
x-version: &version
  sh: set -o pipefail; {{if .VERSION}}printf "%s" "{{.VERSION}}"{{else}}git describe --tags --always --dirty | sed 's/^v//'{{end}}

tasks:
  default:
    desc: クリーンビルドを実行
    cmds:
      - task clean
      - task build

  kill:
    desc: 実行中のアプリケーションを強制終了（起動していない場合は無視）
    cmds:
      - cmd: taskkill /IM {{.APP_NAME}}.exe /F
        ignore_error: true

  clean:
    desc: out/ 以下のファイルを削除
    deps: [kill]
    cmds:
      - rm -rf out

  # AI の作業ディレクトリ temp/ を空にする。引数を取らない固定コマンドにして
  # Claude Code の許可規則で完全一致させ、rm の引数経由で temp/ 外を消せないようにする
  clean-temp:
    desc: temp/ 以下のファイルを削除
    cmds:
      - rm -rf temp
      - mkdir -p temp

  gen-hashes:
    desc: PawnIO バイナリの SHA-256 ハッシュヘッダを生成（src/pawnio_hashes.hpp）
    cmds:
      - cmd: pwsh.exe -NoProfile -File scripts/fetch-deps.ps1

  copy-assets:
    desc: ビルド成果物ディレクトリへのアセットコピー
    internal: true
    cmds:
      - cp {{.APP_NAME}}.toml out/
      - cp data/IntelMSR.bin out/
      - cp data/AMDFamily17.bin out/
      - cp data/alert.wav out/
      - cp data/agent_reset.wav out/
      # アプリが読む local 設定は sysmeters.local.toml だけなので、CLAUDE.local.md 等の
      # *.local.* を out/ へ複製しない。gitignore 対象で存在しない環境があるため失敗は無視する
      - cmd: cp -f {{.APP_NAME}}.local.toml out/
        ignore_error: true

  build:
    desc: デバッグビルド（out/sysmeters.exe）
    deps: [kill, gen-hashes]
    # VERSION の定義と理由は先頭の x-version を参照
    vars:
      VERSION: *version
    cmds:
      - mkdir -p out
      - cmd: pwsh.exe -NoProfile -File build.ps1 -Version "{{.VERSION}}" -Config Debug
      - task: copy-assets

  rebuild:
    desc: 実行中のバイナリを停止し、クリーンビルドして再起動する
    cmds:
      - task: clean
      - task: build
      - cmd: pwsh.exe -NoProfile -Command "Start-Process 'out/{{.APP_NAME}}.exe'"

  release:
    desc: リリースビルド（デバッグ情報なし＋最適化）と zip 作成
    deps: [clean]
    # VERSION の定義と理由は先頭の x-version を参照
    vars:
      VERSION: *version
    cmds:
      - mkdir -p out
      - cmd: pwsh.exe -NoProfile -File build.ps1 -Version "{{.VERSION}}" -Config Release
      - task: copy-assets
      - cp {{.APP_NAME}}.toml out/{{.APP_NAME}}.toml.example
      - printf '' > out/{{.APP_NAME}}.local.toml
      - >-
        pwsh.exe -NoProfile -Command '
        Compress-Archive
        -Path out\{{.APP_NAME}}.exe, out\{{.APP_NAME}}.toml, out\{{.APP_NAME}}.toml.example, out\{{.APP_NAME}}.local.toml, out\IntelMSR.bin, out\AMDFamily17.bin, out\alert.wav, out\agent_reset.wav
        -DestinationPath "out\{{.APP_NAME}}-v{{.VERSION}}-{{.ARCH}}.zip"
        -Force'
      - cmd: echo "Package out/{{.APP_NAME}}-v{{.VERSION}}-{{.ARCH}}.zip"

  test:
    desc: ユニットテストをビルド・実行
    cmds:
      - mkdir -p out
      - cmd: pwsh.exe -NoProfile -File build-tests.ps1
      - cmd: out/test_sysmeters.exe
